<!DOCTYPE html>
<html>
<head><title>FireFly</title></head>
<body>
<div id="FireFlyConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-textarea">
  <div data-role="content">
    <div class="content-primary">
      <h2>萤火虫 FireFly</h2>
      <div id="ffStatus" class="fieldDescription" style="margin-bottom:1.5em;line-height:1.8"></div>
      <form id="FireFlyConfigForm">
        <div class="inputContainer">
          <input is="emby-input" type="text" id="ThunderDownloadDir" label="迅雷下载目录" />
          <div class="fieldDescription">留空为 ~/Downloads/FireFly。请在迅雷 → 设置 → 下载目录里设成同一个目录，并关闭"新建任务时弹出确认"。</div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="MovieLibraryPath" label="电影库目录" />
          <div class="fieldDescription">留空则自动使用 Jellyfin 第一个"电影"媒体库。最好与下载目录在同一块磁盘，入库时就是瞬间完成的移动。</div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="SeriesLibraryPath" label="剧集库目录" />
          <div class="fieldDescription">留空则自动使用 Jellyfin 第一个"节目"媒体库。</div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="TmdbApiKey" label="TMDb API Key" />
          <div class="fieldDescription">用于"发现"热门榜单，在 themoviedb.org 账号设置里免费申请。只保存在本机。</div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="TmdbLanguage" label="TMDb 语言" />
        </div>
        <div class="inputContainer">
          <textarea is="emby-textarea" id="PublisherKeywords" label="优选关键词（一行一个）" rows="3"></textarea>
          <div class="fieldDescription">留空使用内置默认，一般无需填写。一行只放一个词。</div>
        </div>
        <button is="emby-button" type="submit" class="raised button-submit block"><span>保存</span></button>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = '4f1d2c8e-9b7a-4e35-8c61-f1ae0f17f1f1';
      var fields = ['ThunderDownloadDir', 'MovieLibraryPath', 'SeriesLibraryPath', 'TmdbApiKey', 'TmdbLanguage', 'PublisherKeywords'];
      var page = document.querySelector('#FireFlyConfigPage');

      function esc(text) {
        return String(text).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; });
      }
      function line(label, value, ok) {
        return '<div>' + esc(label) + '：<b style="color:' + (ok === false ? '#ff8a80' : 'inherit') + '">' + esc(value) + '</b></div>';
      }
      function loadStatus() {
        ApiClient.ajax({ url: ApiClient.getUrl('FireFly/status'), type: 'GET', dataType: 'json' }).then(function (s) {
          page.querySelector('#ffStatus').innerHTML =
            line('版本', s.version) +
            line('下载目录', s.downloadDir + (s.downloadDirExists ? '' : '（不存在，请创建并在迅雷里设置）'), s.downloadDirExists) +
            line('电影库', (s.movieRoot || '未找到') + (s.sameVolumeMovie === false ? '（与下载目录不在同一磁盘，入库会变成复制）' : ''), !!s.movieRoot) +
            line('剧集库', (s.seriesRoot || '未找到') + (s.sameVolumeSeries === false ? '（与下载目录不在同一磁盘，入库会变成复制）' : ''), !!s.seriesRoot) +
            line('TMDb', s.tmdbConfigured ? '已配置' : '未配置', s.tmdbConfigured) +
            line('规则', '版本 ' + s.rulesVersion + (s.rulesOverride ? '（叠加了数据目录里的 rules.json）' : '') + '，可用搜索源 ' + s.sourceCount + ' 个', s.sourceCount > 0) +
            (s.rulesWarnings || []).map(function (w) { return line('规则提示', w, false); }).join('') +
            line('数据目录', s.dataDir);
        });
      }

      page.addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
          fields.forEach(function (f) { page.querySelector('#' + f).value = config[f] || ''; });
          Dashboard.hideLoadingMsg();
        });
        loadStatus();
      });

      page.querySelector('#FireFlyConfigForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
          fields.forEach(function (f) { config[f] = page.querySelector('#' + f).value.trim(); });
          ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
            Dashboard.processPluginConfigurationUpdateResult(result);
            loadStatus();
          });
        });
        return false;
      });
    })();
  </script>
</div>
</body>
</html>
